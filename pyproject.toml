[project]
name = "gpu-song"
version = "0.1.0"
description = "Hum a musical drone driven by Apple Silicon GPU usage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "questionary>=2.0",
    "sounddevice>=0.5",
]

[project.scripts]
gpu-song = "gpu_song.cli:entry"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_song"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=gpu_song",
    "--cov-report=term-missing",
    "--cov-fail-under=75",
]

[tool.coverage.run]
source = ["gpu_song"]
omit = ["gpu_song/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

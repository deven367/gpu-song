[project]
name = "gpu-song"
version = "0.1.0"
description = "Hum a musical drone driven by Apple Silicon GPU usage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sounddevice>=0.5",
]

[project.scripts]
gpu-song = "gpu_song.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpu_song"]
